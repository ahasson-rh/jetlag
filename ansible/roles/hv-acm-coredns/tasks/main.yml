---
# hv-acm-coredns tasks
# Dynamically configures CoreDNS based on OpenNebula VM allocations

- name: Stop and disable dnsmasq if running
  systemd:
    state: stopped
    enabled: false
    name: dnsmasq
  failed_when: false

- name: Create coredns directory
  file:
    path: /etc/coredns
    state: directory
    mode: '0755'

- name: Query OpenNebula for all allocated VMs (run on bastion)
  shell: |
    set -o pipefail
    onevm list --json 2>/dev/null | jq '.' > /tmp/opennebula-vms.json
  delegate_to: "{{ groups['bastion'][0] }}"
  register: onevm_query
  changed_when: false

- name: Read OpenNebula VM list
  slurp:
    src: /tmp/opennebula-vms.json
  delegate_to: "{{ groups['bastion'][0] }}"
  register: onevm_list_raw
  when: onevm_query is succeeded

- name: Parse OpenNebula VM data
  set_fact:
    opennebula_vms: "{{ onevm_list_raw['content'] | b64decode | from_json }}"
  when: onevm_query is succeeded

- name: Generate Corefile.hosts from OpenNebula VMs
  template:
    src: Corefile.hosts.j2
    dest: /tmp/Corefile.hosts
  delegate_to: "{{ groups['bastion'][0] }}"
  when: opennebula_vms is defined

- name: Copy generated Corefile.hosts to all hypervisors
  synchronize:
    src: /tmp/Corefile.hosts
    dest: /etc/coredns/Corefile.hosts
    mode: push
  delegate_to: "{{ groups['bastion'][0] }}"
  when: opennebula_vms is defined

- name: Configure CoreDNS and NetworkManager
  template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode | default('0644') }}"
  loop:
  - src: Corefile.j2
    dest: /etc/coredns/Corefile
  - src: 99-jetlag-dns.conf
    dest: /etc/NetworkManager/conf.d/99-jetlag-dns.conf
  - src: resolv.conf.j2
    dest: /etc/resolv.conf
    mode: '0644'

- name: Create coredns.service file
  copy:
    dest: /usr/lib/systemd/system/coredns.service
    content: |
      [Unit]
      Description=CoreDNS DNS server
      After=network.target

      [Service]
      ExecStart=/usr/local/bin/coredns -conf=/etc/coredns/Corefile
      Restart=on-failure
      RestartSec=5s

      [Install]
      WantedBy=multi-user.target

- name: Restart NetworkManager
  systemd:
    state: restarted
    name: NetworkManager

- name: Start and enable coredns
  systemd:
    daemon_reload: true
    state: restarted
    enabled: true
    name: coredns
