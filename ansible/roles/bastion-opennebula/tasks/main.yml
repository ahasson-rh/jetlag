---
# bastion-opennebula tasks
# Bootstrap OpenNebula on the bastion for ACM spoke VM allocation

- name: Add OpenNebula repository
  yum_repository:
    name: opennebula
    description: OpenNebula Repository
    baseurl: https://downloads.opennebula.io/repo/7.2/RedHat/9/x86_64/
    gpgcheck: yes
    gpgkey: https://downloads.opennebula.io/repo/repo.key
    enabled: yes

- name: Install OpenNebula packages
  yum:
    name:
    - opennebula
    - opennebula-server
    state: present

- name: Enable and start OpenNebula services
  systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
  - opennebula

- name: Wait for OpenNebula to be ready
  wait_for:
    port: 2633
    delay: 2
    timeout: 30

- name: Register hypervisors with OpenNebula
  shell: |
    set -o pipefail
    for hv in {{ groups['hv'] | join(' ') }}; do
      onehost create --name "${hv}" --type kvm --im kvm --vm qemu --net bridge || true
    done
  register: hypervisors_registered
  changed_when: "'Host created' in hypervisors_registered.stdout"

- name: Create flat virtual network pool for ACM spokes
  block:
  - name: Generate virtual network template
    template:
      src: vnet-acm-flat.j2
      dest: /tmp/vnet-acm-flat.xml

  - name: Create virtual network in OpenNebula
    shell: |
      set -o pipefail
      onevnet create /tmp/vnet-acm-flat.xml || true
    register: vnet_created
    changed_when: "'successfully' in vnet_created.stderr or 'created' in vnet_created.stdout"

- name: Display OpenNebula status
  debug:
    msg: |
      OpenNebula server is running
      =============================
      OpenNebula API Port: 2633

      Check status:
        systemctl status opennebula
        onehost list
        onevnet list

      View registered hypervisors:
        onehost list

      View virtual networks:
        onevnet list
